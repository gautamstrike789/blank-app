[project]
name = "qmis"
version = "0.1.0"
description = "Quality Metrics Intelligence & Alert System - weekly Excel ingestion, alerting and dashboards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "SQLAlchemy>=2.0.30",
    "PyYAML>=6.0.1",
    "plotly>=5.22.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
qmis = "qmis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qmis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
