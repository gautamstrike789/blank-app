# =============================================================================
# QMIS metric registry  --  the single place metric behaviour is defined.
#
#   direction : higher_is_better | lower_is_better | target_range | neutral
#   unit      : percent | count | currency | number
#   stored_as : how the SOURCE file holds the value.  `fraction` means the Excel
#               cell holds 0.8864 for 88.64% and the loader multiplies by 100.
#               Every percent metric is STORED in the database as 0-100.
#   thresholds: interpreted by direction (see metric_config.MetricDefinition).
#   weight    : contribution to the 0-100 Quality Score (only when
#               include_in_score is true).  Weights are renormalised over the
#               metrics that actually have data, so a missing metric does not
#               silently deflate a score.
#   maturity_lag: periods a metric needs before its value is meaningful.  Debit 3
#               cannot be judged until ~2 monthly cycles have elapsed; alerting
#               on an immature period would produce a guaranteed false RED.
#   needs_review: true means the business direction has NOT been confirmed by
#               the business owner.  Such metrics are tracked and trended but
#               never raise alerts and never enter the quality score.
#
# Thresholds below are calibrated on the organisation-level monthly
# distribution observed in Master_Report__140826.xlsx (Dec 2023 - Aug 2026).
# They are starting points for the business owner to tune in Admin > Metrics.
# =============================================================================
version: 1
defaults:
  unit: percent
  stored_as: fraction
  decimals: 2
  alert_on_weekly_change: true
  percentage_change_threshold: 10.0
  critical_change_multiplier: 2.0
  consecutive_decline_periods: 3
  min_denominator: 30
  denominator: submissions
  include_in_score: false
  weight: 0
  group: Quality
  anomaly:
    enabled: true
    lookback: 8
    min_history: 4
    z_threshold: 2.5
    relative_threshold: 25.0
    method: robust
metrics:
