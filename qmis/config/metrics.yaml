  numerator: debit3_count
  percentage_change_threshold: 5.0
  absolute_change_threshold: 3.0
  maturity_lag:
    weekly: 0
    monthly: 3
  description: Share of submissions still giving at their third debit. The clearest early signal of donor
    quality as opposed to sign-up volume.
  level_overrides:
    ba:
      # At ~3.6 submissions per BA per week, a weekly BA rate is arithmetic
