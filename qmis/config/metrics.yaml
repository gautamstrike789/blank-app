- key: d1_pct
  name: Debit 1 %
  aliases:
  - D1%
  - D1 %
  - Debit 1
  - Debit1%
  - Debit 1%
  direction: higher_is_better
  target: 90.0
  warning_threshold: 85.0
  critical_threshold: 80.0
  weight: 20
  include_in_score: true
  numerator: debit1_count
  percentage_change_threshold: 4.0
  absolute_change_threshold: 3.0
  description: 'Share of submissions that reached their first debit. The organisation''s primary acquisition-quality
    gate. Business threshold: 80%.'
  level_overrides:
    ba:
      # At ~3.6 submissions per BA per week, a weekly BA rate is arithmetic
      # noise; evaluation therefore runs on a 4-week rolling window (~14
      # submissions for a typical BA). 15 is the smallest sample at which a
      # rate resolves to better than +/-7pp, so it is the point below which a
      # BA is reported but not alerted on.
      min_denominator: 15
- key: d3_pct
  name: Debit 3 %
  aliases:
  - D3%
  - D3 %
  - Debit 3
  - Debit3%
